name: Toasty

options:
  bundleIdPrefix: com.martyvasquez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: G88C7HMHUJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Toasty:
    type: application
    platform: macOS
    sources:
      - path: Toasty
        excludes:
          - "Resources/Bridge/*"
          - "Resources/SpeechModels/*"
      # The Node bridge and the vendored Agent SDK are copied as plain files
      # (folder reference) into Contents/Resources/Bridge.
      - path: Toasty/Resources/Bridge
        type: folder
        buildPhase: resources
      # Dictation's speech models (fetched by scripts/fetch-speech-models.sh,
      # gitignored), copied into Contents/Resources/SpeechModels.
      - path: Toasty/Resources/SpeechModels
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/GhosttyVt.xcframework
        embed: false
      # Dynamic by the engine's design (Metal inside); embed and sign it.
      - framework: Vendor/CTranscribe.xcframework
        embed: true
        codeSign: true
    info:
      path: Toasty/Info.plist
      properties:
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Marty Vasquez. All rights reserved."
        # Dictation: speech is transcribed on this Mac; audio never leaves it.
        NSMicrophoneUsageDescription: "Toasty listens while you hold Right Option to dictate. Speech is transcribed on this Mac and never leaves it."
        # Folders can be opened with Toasty (Finder, Dock, `open -a Toasty <dir>`).
        # A workspace dragged in the sidebar (private, so it can't be dropped as text).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.martyvasquez.toasty.workspace
            UTTypeDescription: Toasty Workspace
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    entitlements:
      path: Toasty/Toasty.entitlements
      properties:
        # Not sandboxed: Toasty runs your login shell, node and claude.
        com.apple.security.app-sandbox: false
        # Hardened runtime: needed to open the microphone for dictation.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Toasty
        PRODUCT_MODULE_NAME: Toasty
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.toasty
        APP_DISPLAY_NAME: Toasty
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
      configs:
        # Debug builds are a separate app so testing never touches the
        # real Toasty's state, defaults or sessions.
        Debug:
          PRODUCT_NAME: Toasty Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.toasty.debug
          APP_DISPLAY_NAME: Toasty Debug

  # Unit tests, hosted in the Debug app (which starts nothing under tests;
  # see AppDelegate.isRunningTests). Engine tests use its bundled models.
  ToastyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DictationTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Toasty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.toasty.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Toasty Debug.app/Contents/MacOS/Toasty Debug"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Toasty:
    build:
      targets:
        Toasty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ToastyTests
