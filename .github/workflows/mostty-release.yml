# mostty: publish a Sparkle release for every push to main.
#
# Builds with extras/release.sh (version 0.1.<commit count>), signs the
# appcast with the SPARKLE_ED_KEY secret and creates the GitHub release that
# installed copies of mostty update from.
name: mostty release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push releases; an older run still building is cancelled.
concurrency:
  group: mostty-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'martyvasquez/mostty'
    # macos-26 only has Xcode 26; this (preview) image has Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the build number is the commit count.
          fetch-depth: 0

      # The app uses the macOS 27 SDK; upstream Ghostty builds with 27.1.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Download Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          dir="$RUNNER_TEMP/sparkle"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip" -o "$dir/sparkle.zip"
          unzip -q "$dir/sparkle.zip" -d "$dir"
          echo "SPARKLE_BIN=$dir/bin" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install gettext
        run: brew install gettext

      - name: Versions
        run: |
          xcodebuild -version
          zig version

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_KEY" ]; then
            echo "::error::SPARKLE_ED_KEY secret is not set"
            exit 1
          fi
          extras/release.sh auto
